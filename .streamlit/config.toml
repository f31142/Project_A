# 간 CT 검토실 테마 — "Airy Swiss Monochrome"
# 순수 흑백(제트블랙 #09090B · 화이트 #FFFFFF · 뉴트럴 그레이) 기반의 미니멀 의료 UI

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#09090B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#09090B"
linkColor = "#09090B"
borderColor = "#E4E4E7"
dataframeBorderColor = "#E4E4E7"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "999px"
baseFontSize = 14
font = "'IBM Plex Sans KR':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFontWeights = 600
chartCategoricalColors = ["#09090B", "#52525B", "#A1A1AA", "#D4D4D8"]

greenColor = "#09090B"
greenTextColor = "#09090B"
greenBackgroundColor = "#F4F4F5"
yellowColor = "#52525B"
yellowTextColor = "#27272A"
yellowBackgroundColor = "#F4F4F5"
orangeColor = "#52525B"
orangeTextColor = "#27272A"
orangeBackgroundColor = "#F4F4F5"
redColor = "#18181B"
redTextColor = "#18181B"
redBackgroundColor = "#F4F4F5"
blueColor = "#52525B"
blueTextColor = "#3F3F46"
blueBackgroundColor = "#F4F4F5"
